<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Сайт-визитка</title>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <strong 
                class="hello-text">Уроки рисования<br>акварелью 🖌️
            </strong>
        </header>
        <div class="container">
            <div class="user">
                <img width="72" height="72" src="img/avatar.avif" alt="Ирина Некрасова" class="user-avatar">
                <h1 class="user-name">Ирина Некрасова</h1>
                <p class="user-description">Художник</p>
            </div>
            <div class="card">
                <div class="buttons">
                    <a href="https://vk.com/" class="button vk">
                        <img src="img/icons/Vector.svg" alt="VK" class="button-icon"> 
                    </a>
                    <a href="https://web.telegram.org/" class="button tg">
                        <img src="img/icons/Vector-1.svg" alt="Telegram" class="button-icon"> 
                    </a>
                    <a href="https://www.youtube.com/" class="button yt">
                        <img src="img/icons/Vector-2.svg" alt="YouTube" class="button-icon"> 
                    </a>
                </div>
                <a href="https://github.com/" class="button">
                    <img src="img/icons/🦆GitHub_.svg" alt="GitHub" class="button-icon">
                    <span class="button-text">Профиль Github </span> 
                </a>
            </div>   
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
